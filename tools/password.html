<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Password Generator - DevKit</title>

    <meta
      name="description"
      content="Generate strong and secure passwords quickly with DevKit's free online Password Generator."
    />

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/password.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <header class="navbar">
      <a href="../index.html" class="logo">
        <span>&lt;/&gt;</span>
        DevKit
      </a>

      <nav class="nav-links">
        <a href="../index.html">Home</a>
        <a href="../index.html#tools">Tools</a>
        <a href="../index.html#about">About</a>
      </nav>

      <a href="../index.html#tools" class="nav-button"> All tools </a>
    </header>

    <!-- MAIN -->
    <main class="password-page">
      <!-- HEADER -->
      <section class="password-header">
        <p class="section-label">SECURITY TOOL</p>

        <h1>Password <span>Generator</span></h1>

        <p>Create strong and secure passwords instantly.</p>
      </section>

      <!-- PASSWORD TOOL -->
      <section class="password-tool">
        <!-- PASSWORD DISPLAY -->
        <div class="password-display">
          <input
            type="text"
            id="passwordOutput"
            value=""
            readonly
            placeholder="Your password will appear here"
          />

          <button id="copyBtn">Copy</button>
        </div>

        <!-- STRENGTH -->
        <div class="strength-section">
          <div class="strength-top">
            <span>Password Strength</span>

            <span id="strengthText"> - </span>
          </div>

          <div class="strength-bar">
            <div id="strengthFill" class="strength-fill"></div>
          </div>
        </div>

        <!-- LENGTH -->
        <div class="length-section">
          <div class="option-header">
            <label for="length"> Password Length </label>

            <span id="lengthValue"> 16 </span>
          </div>

          <input type="range" id="length" min="6" max="40" value="16" />
        </div>

        <!-- OPTIONS -->
        <div class="options-section">
          <h2>Password Options</h2>

          <label class="checkbox-option">
            <input type="checkbox" id="uppercase" checked />

            <span>Uppercase Letters (A-Z)</span>
          </label>

          <label class="checkbox-option">
            <input type="checkbox" id="lowercase" checked />

            <span>Lowercase Letters (a-z)</span>
          </label>

          <label class="checkbox-option">
            <input type="checkbox" id="numbers" checked />

            <span>Numbers (0-9)</span>
          </label>

          <label class="checkbox-option">
            <input type="checkbox" id="symbols" checked />

            <span>Symbols (!@#$)</span>
          </label>
        </div>

        <!-- GENERATE -->
        <button id="generateBtn" class="generate-btn">Generate Password</button>
      </section>
    </main>

    <!-- FOOTER -->
    <footer>
      <div class="footer-logo">&lt;/&gt; DevKit</div>

      <p>Simple tools for developers, students and creators.</p>

      <p class="copyright">© 2026 DevKit. All rights reserved.</p>
    </footer>

    <script src="../js/password.js"></script>
  </body>
</html>
